<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A single, searchable home for ARC workplace resources.">
    <title>LRC Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260805-11">
    <script defer src="bookmarks-data.js?v=20260805-8"></script>
    <script defer src="campus-hours-data.js?v=20260805-3"></script>
    <script defer src="script.js?v=20260805-8"></script>
</head>
<body>
    <a class="skip-link" href="#resource-grid">Skip to resources</a>

    <header class="site-header">
        <a class="brand" href="#" aria-label="LRC Hub home">
            <span class="brand-mark">
                <img src="logo.png" alt="">
            </span>
            <span>
                <strong>Learning Resource Center</strong>
                <small>Hub</small>
            </span>
        </a>
        <div class="header-actions">
            <span class="resource-total" id="resource-total"></span>
            <button class="view-button" id="view-toggle" type="button" aria-label="Switch to compact view" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h6v6H4zm10 0h6v6h-6zM4 15h6v4H4zm10 0h6v4h-6z"/></svg>
            </button>
        </div>
    </header>
    <main>
        <section class="workspace" aria-label="Resource directory">
            <nav class="categories" id="categories" aria-label="Resource categories"></nav>

            <div class="directory">
                <div class="directory-heading">
                    <div>
                        <p class="section-kicker">Directory</p>
                        <h1 id="section-title">Quick Links</h1>
                    </div>
                    <p id="result-count" aria-live="polite"></p>
                </div>

                <form class="search" role="search" id="search-form">
                    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg>
                    <label class="visually-hidden" for="resource-search">Search all resources</label>
                    <input id="resource-search" type="search" placeholder="Search all sections..." autocomplete="off">
                    <kbd>/</kbd>
                    <button type="button" id="clear-search" aria-label="Clear search">×</button>
                </form>

                <div class="resource-grid" id="resource-grid"></div>

                <div class="empty-state" id="empty-state" hidden>
                    <span>0</span>
                    <h2>No resources found</h2>
                    <p>Try another search or browse a different category.</p>
                    <button type="button" id="reset-filters">Show quick links</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Learning Resource Center Hub</p>
        <p>American River College · Los Rios Community College District</p>
    </footer>
</body>
